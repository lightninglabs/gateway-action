name: gateway

# Canonical consumer workflow shim for gateway — PUBLIC entry point.
#
# Use this shim from ANY consumer repo, public or private. It points at the
# public `lightninglabs/gateway-action` repo, which resolves from public repos
# (unlike `lightninglabs/gateway/.github/actions/review@...`, which only
# resolves from private/internal org repos).
#
# Drop this file at `.github/workflows/gateway.yml` in your repo, then
# customize:
#   1. The `@<SHA>` on the `uses:` line — pin to a full commit SHA of a
#      gateway-action release, with a trailing `# vX.Y.Z` comment.
#      See https://github.com/lightninglabs/gateway-action/releases.
#   2. The Anthropic / Claude auth secret(s) you have available (one of
#      ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN must be set; both are
#      accepted with API tried first and OAuth as fallback).
#
# `installation_id` is optional and omitted below: the runtime resolves the App
# install for this repo from app_id/private_key. Add it only to pin a specific
# installation (see gateway docs/consumer-setup.md).
#
# gateway fires on:
#   - issue_comment.created          — a /gateway <command> comment on a PR
#   - pull_request_review_comment.created — a /gateway dismiss, promote, or
#                                      explain reply on an inline finding
#                                      thread (the finding id is inferred
#                                      from the thread when omitted)
#   - pull_request.review_requested  — GitHub Re-request review button
#   - pull_request.closed            — cleanup on close/merge
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [review_requested, closed]

permissions:
  # The action mints an App installation token internally; the GITHUB_TOKEN
  # handed to this shim is unused, so we minimise it.
  contents: read

jobs:
  review:
    # Comment events fire for every comment; gate on the /gateway prefix
    # so non-command comments don't boot a runner at all.
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && contains(github.event.comment.body, '/gateway')) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(github.event.comment.body, '/gateway'))
      }}
    runs-on: ubuntu-latest
    # A GitHub timeout cancels the job before gateway can post an error,
    # leaving a stale holding comment; real multi reviews have run past
    # 15 minutes, so leave room.
    timeout-minutes: 30
    # Optional: the default review effort level (low, medium, high, xhigh,
    # max). Unset means medium. Maintainers can override it per PR with
    # `/gateway review <level>`; plain re-reviews reuse the PR's last level.
    # env:
    #   GATEWAY_CLAUDE_EFFORT: medium
    steps:
      - uses: lightninglabs/gateway-action@REPLACE_WITH_COMMIT_SHA # v0.7.1
        with:
          event_name:      ${{ github.event_name }}
          event_action:    ${{ github.event.action }}
          repo:            ${{ github.repository }}
          pr_number:       ${{ github.event.issue.number || github.event.pull_request.number }}
          actor:           ${{ github.event.sender.login }}
          comment_body:    ${{ github.event.comment.body }}
          comment_id:      ${{ github.event.comment.id }}
          comment_in_reply_to: ${{ github.event.comment.in_reply_to_id }}
          # Credentials — passed as `with:` inputs (composite actions cannot
          # declare a `secrets:` block). At least one of claude_code_oauth_token
          # or anthropic_api_key must be set. This template uses OAuth; to use an
          # Anthropic API key instead (tried first if both are set), add:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          app_id:                  ${{ secrets.GATEWAY_APP_ID }}
          private_key:             ${{ secrets.GATEWAY_PRIVATE_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
